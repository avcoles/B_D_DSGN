<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Inter is the entire typographic system for the chrome. Everything after
         it exists only so the type specimens can render each showcased page's
         real faces — you can't document a typeface you haven't loaded.
         Instrument Serif + JetBrains Mono for Auralis, Cormorant Garamond +
         Archivo for Studio Boutique. Ensemble needs none: its own stack falls
         back to system Helvetica. Archivo is requested on both its width and
         weight axes because Action Figure's display cut is the same family at
         width 112 / weight 900 — Boutique's 300–700 range is a subset of it. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;500;700;900&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&family=Cormorant+Garamond:wght@300..700&family=Archivo:wdth,wght@62..125,100..900&family=Hanken+Grotesk:wght@300..500&display=swap"
      rel="stylesheet"
    />
    <title>Project Rodin</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
